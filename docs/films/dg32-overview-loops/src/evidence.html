<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=640"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>

@font-face{font-family:"DG Serif";src:url("assets/fonts/georgia.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"DG Serif";src:url("assets/fonts/georgiai.ttf") format("truetype");font-weight:400;font-style:italic}
@font-face{font-family:"DG Sans";src:url("assets/fonts/arial.ttf") format("truetype");font-weight:400}
@font-face{font-family:"DG Sans";src:url("assets/fonts/arialbd.ttf") format("truetype");font-weight:700}
@font-face{font-family:"DG Mono";src:url("assets/fonts/cour.ttf") format("truetype");font-weight:400}

body{margin:0;background:#101212}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#101212;color:#eeeae2;font-family:"DG Sans",sans-serif}
#grid{position:absolute;inset:0;opacity:.4;background-image:linear-gradient(#3d453b22 1px,transparent 1px),linear-gradient(90deg,#3d453b22 1px,transparent 1px);background-size:40px 40px}
.mono{font-family:"DG Mono",monospace;letter-spacing:2px;text-transform:uppercase}
.box{position:absolute;border:2px solid #3d453b;border-radius:10px;background:#191d1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}

.lane{position:absolute;top:120px;width:280px;height:460px;border:2px solid #3d453b;border-radius:10px;background:#191d1b;box-sizing:border-box;padding:20px}
.lane span{font-size:22px;color:#a7b09f}
.lane.sil{border-style:dashed;background:transparent}
.lane.sil em{position:absolute;left:20px;right:20px;bottom:24px;font-style:normal;font-size:22px;line-height:1.5;color:#a7b09f}
.fig{opacity:0;position:absolute;width:240px;padding:18px 0;text-align:center;border:2px solid #d4a36e;border-radius:8px;background:#101212;font-family:"DG Serif",serif;font-size:42px;color:#eeeae2}
#cap{position:absolute;left:60px;top:56px;font-size:24px;color:#a7b09f}

</style>
</head>
<body>
<div id="root" data-composition-id="evidence" data-start="0" data-width="1920" data-height="640" data-duration="9">
  <div id="grid" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>
  <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="1">

    <div id="cap" class="mono">Five kinds of evidence · none is silicon yet</div>
    <div class="lane" id="l0" style="left:60px"><span class="mono">Simulated</span></div><div class="lane" id="l1" style="left:360px"><span class="mono">Post-route</span></div><div class="lane" id="l2" style="left:660px"><span class="mono">Analytic</span></div><div class="lane" id="l3" style="left:960px"><span class="mono">Tool estimate</span></div><div class="lane" id="l4" style="left:1260px"><span class="mono">Process nominal</span></div><div class="lane sil" id="lsil" style="left:1560px"><span class="mono">Silicon</span><em class="mono">first silicon · Sep 2026 shuttle</em></div>
    <div class="fig" id="e00" style="left:80px;top:250px">39 cycles</div><div class="fig" id="e01" style="left:80px;top:360px">~100 kHz</div><div class="fig" id="e10" style="left:380px;top:250px">55–62 MHz</div><div class="fig" id="e20" style="left:680px;top:250px">82 %</div><div class="fig" id="e30" style="left:980px;top:250px">~0.43 W</div><div class="fig" id="e40" style="left:1280px;top:250px">130 nm</div>

  </div>
</div>
<script>
(function(){
  const tl = gsap.timeline({ paused: true });
  const E = "power3.out";
  tl.fromTo("#e00",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},0.50);
  tl.to("#l0",{borderColor:"#d4a36e",duration:.3},0.50);
  tl.fromTo("#e01",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},1.40);
  tl.to("#l0",{borderColor:"#d4a36e",duration:.3},1.40);
  tl.fromTo("#e10",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},2.30);
  tl.to("#l1",{borderColor:"#d4a36e",duration:.3},2.30);
  tl.fromTo("#e20",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},3.20);
  tl.to("#l2",{borderColor:"#d4a36e",duration:.3},3.20);
  tl.fromTo("#e30",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},4.10);
  tl.to("#l3",{borderColor:"#d4a36e",duration:.3},4.10);
  tl.fromTo("#e40",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},5.00);
  tl.to("#l4",{borderColor:"#d4a36e",duration:.3},5.00);
  tl.to(".fig",{opacity:0,duration:.4},8.3);
  tl.to(".lane:not(.sil)",{borderColor:"#3d453b",duration:.4},8.3);
  window.__timelines["evidence"] = tl;
})();
</script>
</body>
</html>
